<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" preserveAspectRatio="none" class="section-line">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="20%" style="stop-color:#FF5A1F;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FF5A1F;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#FF5A1F;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>
  
  <!-- Main horizontal line -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#lineGrad)" stroke-width="1" class="section-line-main"/>
  
  <!-- Moving dash effect -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="#FF5A1F" stroke-width="2" stroke-dasharray="20,40" stroke-dashoffset="0" opacity="0.4" class="section-line-dash">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Center highlight -->
  <circle cx="600" cy="10" r="4" fill="#FF5A1F" opacity="0.6" class="section-line-center">
    <animate attributeName="r" dur="2s" repeatCount="indefinite" values="3;5;3"/>
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;0.8;0.4"/>
  </circle>
</svg>