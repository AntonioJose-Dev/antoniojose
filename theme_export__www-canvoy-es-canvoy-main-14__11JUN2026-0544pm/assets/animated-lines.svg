<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="lines-container" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5A1F;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#FF5A1F;stop-opacity:0.3"/>
      <stop offset="70%" style="stop-color:#FF5A1F;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF5A1F;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5A1F;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FF5A1F;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FF5A1F;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Horizontal lines -->
  <g class="h-lines">
    <line x1="-50" y1="80" x2="450" y2="80" stroke="url(#lineGrad1)" stroke-width="1" class="anim-line">
      <animate attributeName="stroke-dasharray" dur="3s" repeatCount="indefinite" values="0,200;200,0;0,200"/>
      <animate attributeName="x1" dur="6s" repeatCount="indefinite" values="-100;0;-100"/>
    </line>
    <line x1="-50" y1="150" x2="450" y2="150" stroke="url(#lineGrad2)" stroke-width="1.5" class="anim-line">
      <animate attributeName="stroke-dasharray" dur="2.5s" repeatCount="indefinite" values="0,250;250,0;0,250"/>
      <animate attributeName="x1" dur="5s" repeatCount="indefinite" values="0;50;0"/>
    </line>
    <line x1="-50" y1="220" x2="450" y2="220" stroke="url(#lineGrad1)" stroke-width="1" class="anim-line">
      <animate attributeName="stroke-dasharray" dur="4s" repeatCount="indefinite" values="0,180;180,0;0,180"/>
      <animate attributeName="x1" dur="7s" repeatCount="indefinite" values="-50;50;-50"/>
    </line>
    <line x1="-50" y1="290" x2="450" y2="290" stroke="url(#lineGrad2)" stroke-width="1.5" class="anim-line">
      <animate attributeName="stroke-dasharray" dur="3.5s" repeatCount="indefinite" values="0,220;220,0;0,220"/>
      <animate attributeName="x1" dur="6s" repeatCount="indefinite" values="0;-50;0"/>
    </line>
    <line x1="-50" y1="350" x2="450" y2="350" stroke="url(#lineGrad1)" stroke-width="1" class="anim-line">
      <animate attributeName="stroke-dasharray" dur="2.8s" repeatCount="indefinite" values="0,190;190,0;0,190"/>
      <animate attributeName="x1" dur="5.5s" repeatCount="indefinite" values="50;0;50"/>
    </line>
  </g>
  
  <!-- Vertical lines -->
  <g class="v-lines">
    <line x1="80" y1="-50" x2="80" y2="450" stroke="url(#lineGrad1)" stroke-width="1" class="anim-line-v">
      <animate attributeName="y1" dur="5s" repeatCount="indefinite" values="-50;50;-50"/>
    </line>
    <line x1="160" y1="-50" x2="160" y2="450" stroke="url(#lineGrad2)" stroke-width="1.5" class="anim-line-v">
      <animate attributeName="y1" dur="4s" repeatCount="indefinite" values="0;100;0"/>
    </line>
    <line x1="240" y1="-50" x2="240" y2="450" stroke="url(#lineGrad1)" stroke-width="1" class="anim-line-v">
      <animate attributeName="y1" dur="6s" repeatCount="indefinite" values="-50;0;-50"/>
    </line>
    <line x1="320" y1="-50" x2="320" y2="450" stroke="url(#lineGrad2)" stroke-width="1.5" class="anim-line-v">
      <animate attributeName="y1" dur="4.5s" repeatCount="indefinite" values="50;-50;50"/>
    </line>
  </g>
</svg>