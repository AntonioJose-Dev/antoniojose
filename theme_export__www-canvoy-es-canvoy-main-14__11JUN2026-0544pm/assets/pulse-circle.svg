<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="pulse-container">
  <defs>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF5A1F;stop-opacity:0.3"/>
      <stop offset="70%" style="stop-color:#FF5A1F;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FF5A1F;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer ring - slowest pulse -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FF5A1F" stroke-width="1" opacity="0.1" class="pulse-ring pulse-ring-1">
    <animate attributeName="r" dur="4s" repeatCount="indefinite" values="70;95;70"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0.05;0.2;0.05"/>
  </circle>
  
  <!-- Middle ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#FF5A1F" stroke-width="1.5" opacity="0.15" class="pulse-ring pulse-ring-2">
    <animate attributeName="r" dur="3s" repeatCount="indefinite" values="50;70;50"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.1;0.25;0.1"/>
  </circle>
  
  <!-- Inner ring - fastest pulse -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#FF5A1F" stroke-width="2" opacity="0.2" class="pulse-ring pulse-ring-3">
    <animate attributeName="r" dur="2s" repeatCount="indefinite" values="30;45;30"/>
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.15;0.35;0.15"/>
  </circle>
  
  <!-- Center glow -->
  <circle cx="100" cy="100" r="20" fill="url(#pulseGrad)" class="pulse-center">
    <animate attributeName="r" dur="3s" repeatCount="indefinite" values="15;25;15"/>
  </circle>
</svg>