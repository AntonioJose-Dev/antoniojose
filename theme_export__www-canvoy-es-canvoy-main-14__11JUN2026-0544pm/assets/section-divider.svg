<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 60" preserveAspectRatio="none" class="section-divider">
  <defs>
    <linearGradient id="divGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0C0C14;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#FF5A1F;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#FF5A1F;stop-opacity:0.5"/>
      <stop offset="75%" style="stop-color:#FF5A1F;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0C0C14;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="divGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5A1F;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FF5A1F;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF5A1F;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Main wave line -->
  <path 
    fill="none" 
    stroke="url(#divGrad1)" 
    stroke-width="1.5" 
    stroke-linecap="round"
    d="M0,30 Q180,10 360,30 T720,30 T1080,30 T1440,30"
    class="divider-line"
  >
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,30 Q180,10 360,30 T720,30 T1080,30 T1440,30;
              M0,30 Q180,50 360,30 T720,30 T1080,30 T1440,30;
              M0,30 Q180,10 360,30 T720,30 T1080,30 T1440,30"/>
  </path>
  
  <!-- Secondary accent line -->
  <path 
    fill="none" 
    stroke="url(#divGrad2)" 
    stroke-width="1" 
    stroke-linecap="round"
    opacity="0.6"
    d="M0,45 Q180,25 360,45 T720,45 T1080,45 T1440,45"
    class="divider-line divider-line--sub"
  >
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,45 Q180,25 360,45 T720,45 T1080,45 T1440,45;
              M0,45 Q180,65 360,45 T720,45 T1080,45 T1440,45;
              M0,45 Q180,25 360,45 T720,45 T1080,45 T1440,45"/>
  </path>
  
  <!-- Decorative dots -->
  <g class="divider-dots">
    <circle cx="360" cy="30" r="3" fill="#FF5A1F" opacity="0.5" class="dot">
      <animate attributeName="cy" dur="3s" repeatCount="indefinite" values="28;32;28"/>
    </circle>
    <circle cx="720" cy="30" r="4" fill="#FF5A1F" opacity="0.7" class="dot">
      <animate attributeName="cy" dur="3s" repeatCount="indefinite" values="26;34;26"/>
    </circle>
    <circle cx="1080" cy="30" r="3" fill="#FF5A1F" opacity="0.5" class="dot">
      <animate attributeName="cy" dur="3s" repeatCount="indefinite" values="28;32;28"/>
    </circle>
  </g>
</svg>